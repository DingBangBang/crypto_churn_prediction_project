# 加密货币用户行为聚类分析与流失预测 — 一键堆栈
#
# `docker compose up -d --build` 会：构建镜像 -> 首次启动自动跑完整流水线
# (data_fetcher -> feature_engineer -> cluster_analyzer -> churn_model) ->
# **顺手把四个去向都交付掉**（邮件 / Lark 卡片 / reports/status.html 运行状态页 /
# 快照 + 运行元数据）-> 启动 Streamlit 看板 (http://localhost:8501)。
# 之后重启会直接启动看板（用 marker 判断）；若此时想补发四去向，容器会用
# `scripts/daily_run.py --deliver-only` 复用已有预测结果重发（见 docker-entrypoint.sh）。
#
# 说明：容器内**不能**弹 macOS 通知、也不能打开浏览器（无 GUI），所以：
#   * 通知与「自动打开」由宿主机负责 —— 用根目录的 ./start.sh（up 之后把容器日志
#     **实时流到终端**并等待就绪，最后自动打开看板 + reports/status.html）；
#   * 状态页写在挂载出去的 ./reports/status.html，宿主机双击即可看全部内容。
# 进度可见性：`./start.sh`（推荐）或 `docker compose up --build`（前台）或
#   `docker compose logs -f churn-app`（后台跑时另开终端），日志里含
#   `[3/5] ▶ 行为聚类（HDBSCAN）` 与 ` [████░░] 62% 1240/2000 抓取地址` 形式的进度条。
# 想「只跑流水线、不推送」（例如 CI）：RUN_DELIVER=0 docker compose up -d --build
services:
  churn-app:
    build: .
    image: bonnie333333333/crypto-churn-prediction:latest
    container_name: crypto-churn-app
    restart: unless-stopped
    # environment.env 可选：放 ETHERSCAN_API_KEY / ADDRESS_LIMIT / 邮件与 Lark 配置。
    # 没有任何 env 文件时仍可启动（只会展示已有 DB 数据）。
    env_file:
      - path: "environment.env"
        required: false
      - path: ".env"
        required: false
    environment:
      # 口径优先级（**重要**）：`environment:` 会覆盖上面 env_file 里的同名键，所以这里
      # 只是「外壳没导出 ADDRESS_LIMIT 时」的默认值 —— 默认 2000，与本机全量验证口径一致。
      #   * 快速演示（测试模式，产物带 _test 后缀）：ADDRESS_LIMIT=200 ./start.sh
      #   * 若 environment.env 写 2000、这里却留 200，容器会**静默退化成**只读测试库
      #     （data/crypto_churn_test.db，200 地址）—— 看板看起来"没更新"，就是这个坑。
      ADDRESS_LIMIT: "${ADDRESS_LIMIT:-2000}"
      CHAIN_ID: "${CHAIN_ID:-1}"
      CHURN_DB_PATH: "/app/data/crypto_churn.db"
      DASHBOARD_URL: "http://localhost:8501"
      # 设为 1 可强制下次启动重跑整个流水线。
      FORCE_PIPELINE: "${FORCE_PIPELINE:-0}"
      # 1（默认）= 首启/补发时交付四个去向；0 = 只跑流水线（CI / 只想拿数据）。
      RUN_DELIVER: "${RUN_DELIVER:-1}"
      # 容器内无 GUI：交付层据此跳过 macOS 通知与 open 浏览器（幂等，可覆盖）。
      CHURN_HEADLESS: "${CHURN_HEADLESS:-1}"
      # 注意：邮件/Lark 的收件人与 webhook **不要**在这里写死（会覆盖 env_file），
      # 统一放 environment.env，由 env_file 注入。
      # 抓取同理：容器里没有 macOS 系统代理，要经宿主机代理抓 Etherscan 就在
      # environment.env 里写 FETCH_PROXY=http://host.docker.internal:7897
      # （下面的 extra_hosts 已把 host.docker.internal 指到宿主机）。
    ports:
      - "8501:8501"
    extra_hosts:
      # 让容器能用 host.docker.internal 访问宿主机上的 Clash/mihomo 代理端口。
      - "host.docker.internal:host-gateway"
    volumes:
      # SQLite 数据库（宿主可读，方便备份/迁移）与生成的报告/状态页。
      - ./data:/app/data:rw
      - ./reports:/app/reports:rw
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; \
sys.exit(0 if urllib.request.urlopen('http://localhost:8501/_stcore/health',timeout=5).status==200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
